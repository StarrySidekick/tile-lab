<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tile Lab — a Carcassonne-style sandbox</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <canvas id="board"></canvas>

    <aside id="panel">
      <header>
        <h1>Tile Lab <span id="version" class="ver" title="build">…</span></h1>
        <p id="phase">—</p>
      </header>

      <section class="hand">
        <canvas id="preview" width="120" height="120"></canvas>
        <div class="hand-meta">
          <div id="tileName">—</div>
          <div class="dim"><span id="deckCount">0</span> tiles left</div>
          <div id="lead"></div>
          <div class="btns" id="actions"></div>
        </div>
      </section>

      <section id="market" class="tools" style="display:none"></section>

      <section id="scores"></section>

      <section class="tools">
        <h2>Game</h2>
        <label class="row">Mode
          <select id="mode"></select>
        </label>
        <label id="meepleRow"><input type="checkbox" id="useMeeples" checked /> Use meeples</label>
        <label class="row" id="playerRow">Players
          <select id="playerCount">
            <option>2</option><option>3</option><option>4</option><option>5</option>
          </select>
        </label>
        <label class="row" id="botRow" title="Computer players take the last seats, so you are always the first player. Takes effect straight away.">Computer
          <select id="botCount"></select>
        </label>
        <label class="row" id="botSkillRow" title="All three use the same judgement; the difference is how much noise they add and whether they bother with abbeys, flips and the big follower.">Skill
          <select id="botSkill"></select>
        </label>
        <label class="row" id="botSpeedRow">Thinking
          <select id="botSpeed">
            <option value="900">Slow</option>
            <option value="380" selected>Brisk</option>
            <option value="0">Instant</option>
          </select>
        </label>
        <label class="row" id="seedRow">Seed <input id="seed" placeholder="blank = random" /></label>
        <label class="row" title="How many tiles you lay before play passes on. Each one is a full place-and-act step.">Tiles per turn
          <select id="tilesPerTurn">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          </select>
        </label>
        <button id="newGame" class="primary">New game</button>
        <button id="export">Export the chronicle</button>
        <p class="hint" id="modeHint"></p>
      </section>

      <section class="tools">
        <h2>Mechanics</h2>
        <div id="mechanics"></div>
        <p class="hint">Bolt onto any mode, in any combination. Applied on the next new game (except fog).</p>
      </section>

      <section class="tools">
        <h2>Tile pool</h2>
        <div id="groups"></div>
        <p class="hint">Changes apply on the next new game.</p>
      </section>

      <section class="tools">
        <h2>Sound &amp; motion</h2>
        <label title="Floating scores, feature flashes and the little landing square. Off by default if your system asks for reduced motion."><input type="checkbox" id="effects" checked /> Score effects</label>
        <label><input type="checkbox" id="sound" checked /> Sound effects</label>
        <label class="row">Volume
          <input type="range" id="volume" min="0" max="1" step="0.05" value="0.55" />
        </label>
        <label class="row">Test <select id="testSound"></select></label>
      </section>

      <section class="tools">
        <h2>Sandbox</h2>
        <label><input type="checkbox" id="freePlace" /> Free placement (ignore edge matching)</label>
        <label><input type="checkbox" id="hints" checked /> Show where tiles can go</label>
        <label><input type="checkbox" id="debug" /> Feature overlay <kbd>D</kbd></label>
        <label class="row">Force next tile
          <select id="forceTile"><option value="">— random —</option></select>
        </label>
      </section>

      <section class="log-wrap">
        <h2>Log</h2>
        <div id="log"></div>
      </section>

      <footer class="dim">
        drag to pan · scroll to zoom · <kbd>R</kbd> rotate · <kbd>F</kbd> flip · <kbd>1</kbd>–<kbd>4</kbd> pick
        · <kbd>C</kbd> recenters · <a href="./atlas.html">tile atlas</a>
      </footer>
    </aside>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tile Lab — atlas</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body { overflow: auto; }
    .atlas { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .card canvas { width: 100%; aspect-ratio: 1; border-radius: 4px; display: block; }
    .card h3 { margin: 7px 0 2px; font-size: 12px; }
    .card p { margin: 0; font-size: 10.5px; color: var(--dim); line-height: 1.4; }
    .edges { font: 10px ui-monospace, monospace; color: var(--accent); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="atlas">
    <h1>Tile atlas</h1>
    <p class="dim">
      All tile types at rotation 0, with meeple anchors marked. Edges read N E S W
      (c=city, r=road, f=field). <a href="./index.html">← back to the game</a>
    </p>
    <div class="grid" id="grid"></div>
  </div>

  <script type="module">
    import { TILE_TYPES } from './src/tiles.js';
    import { drawTile, drawMeeple, PLAYER_COLORS } from './src/art.js';

    const grid = document.getElementById('grid');
    const SIZE = 240;

    for (const t of TILE_TYPES) {
      const card = document.createElement('div');
      card.className = 'card';
      const cv = document.createElement('canvas');
      cv.width = cv.height = SIZE;
      card.appendChild(cv);

      const ctx = cv.getContext('2d');
      ctx.save();
      ctx.scale(SIZE, SIZE);
      drawTile(ctx, t);
      ctx.restore();
      // Meeple anchors, one per feature, so mis-placed spots are obvious.
      t.spots.forEach(([sx, sy], i) => {
        drawMeeple(ctx, sx * SIZE, sy * SIZE, SIZE * 0.16, PLAYER_COLORS[i % PLAYER_COLORS.length]);
      });

      const feats = t.feats
        .map((f) => f.type[0].toUpperCase() + (f.sides.length ? f.sides.join('') : '') + (f.shield ? '+' : ''))
        .join(' ');
      card.insertAdjacentHTML('beforeend', `
        <h3>${t.id} &times;${t.n}</h3>
        <p>${t.name}</p>
        <p class="edges">${t.edges.join(' ')}</p>
        <p>${feats}</p>`);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
